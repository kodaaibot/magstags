<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="360" height="580" role="img" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">
  <rect x="0" y="0" width="360" height="580" fill="#f5f1ea"/>

  <!-- header -->
  <text x="20" y="42" fill="#8a847a" font-size="10.5" font-weight="600" letter-spacing="1.6">SHIPPING &amp; RETURNS SETUP</text>
  <text x="20" y="67" fill="#1a1916" font-size="17.5" font-weight="600">Where does Google read it?</text>

  <!-- START -->
  <rect x="148" y="84" width="64" height="24" rx="12" fill="#0E7490"/>
  <text x="180" y="100.5" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="600" letter-spacing="1">START</text>
  <line x1="180" y1="108" x2="180" y2="121" stroke="#b9b2a4" stroke-width="1.5"/>

  <!-- Card 1 -->
  <rect x="16" y="122" width="328" height="140" rx="12" fill="#ffffff" stroke="#d8d2c4" stroke-width="1"/>
  <circle cx="42" cy="151" r="13" fill="#0E7490"/>
  <text x="42" y="156" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">1</text>
  <text x="64" y="147" fill="#1a1916" font-size="14" font-weight="600">Already using</text>
  <text x="64" y="165" fill="#1a1916" font-size="14" font-weight="600">Merchant Center?</text>
  <line x1="20" y1="182" x2="340" y2="182" stroke="#ece6d9" stroke-width="1"/>
  <rect x="20" y="194" width="40" height="19" rx="9.5" fill="#0E7490"/>
  <text x="40" y="207" text-anchor="middle" fill="#fff" font-size="10" font-weight="600" letter-spacing="0.5">YES</text>
  <text x="70" y="201" fill="#2d2a26" font-size="12.5">Set the standard policy</text>
  <text x="70" y="217" fill="#2d2a26" font-size="12.5">at account level.</text>
  <text x="20" y="240" fill="#e09226" font-size="11.5" font-weight="500">Exceptions &#8594; product-level</text>
  <text x="20" y="254" fill="#e09226" font-size="11.5" font-weight="500">feed overrides.</text>

  <!-- connector NO 1->2 -->
  <line x1="180" y1="262" x2="180" y2="282" stroke="#b9b2a4" stroke-width="1.5"/>
  <text x="188" y="277" fill="#8a847a" font-size="10" font-weight="600">NO</text>
  <polygon points="180,284 176,278 184,278" fill="#b9b2a4"/>

  <!-- Card 2 -->
  <rect x="16" y="284" width="328" height="116" rx="12" fill="#ffffff" stroke="#d8d2c4" stroke-width="1"/>
  <circle cx="42" cy="313" r="13" fill="#0E7490"/>
  <text x="42" y="318" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">2</text>
  <text x="64" y="309" fill="#1a1916" font-size="14" font-weight="600">Is one simple</text>
  <text x="64" y="327" fill="#1a1916" font-size="14" font-weight="600">policy enough?</text>
  <line x1="20" y1="344" x2="340" y2="344" stroke="#ece6d9" stroke-width="1"/>
  <rect x="20" y="356" width="40" height="19" rx="9.5" fill="#0E7490"/>
  <text x="40" y="369" text-anchor="middle" fill="#fff" font-size="10" font-weight="600" letter-spacing="0.5">YES</text>
  <text x="70" y="369" fill="#2d2a26" font-size="12.5">Set it in Search Console.</text>

  <!-- connector NO 2->3 -->
  <line x1="180" y1="400" x2="180" y2="420" stroke="#b9b2a4" stroke-width="1.5"/>
  <text x="188" y="415" fill="#8a847a" font-size="10" font-weight="600">NO</text>
  <polygon points="180,422 176,416 184,416" fill="#b9b2a4"/>

  <!-- Card 3 -->
  <rect x="16" y="422" width="328" height="142" rx="12" fill="#ffffff" stroke="#d8d2c4" stroke-width="1"/>
  <circle cx="42" cy="451" r="13" fill="#0E7490"/>
  <text x="42" y="456" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">3</text>
  <text x="64" y="447" fill="#1a1916" font-size="14" font-weight="600">Complex, or varies</text>
  <text x="64" y="465" fill="#1a1916" font-size="14" font-weight="600">by product?</text>
  <line x1="20" y1="482" x2="340" y2="482" stroke="#ece6d9" stroke-width="1"/>
  <text x="20" y="504" fill="#2d2a26" font-size="12.5">Use Organisation-level</text>
  <text x="20" y="520" fill="#2d2a26" font-size="12.5">structured data.</text>
  <text x="20" y="543" fill="#e09226" font-size="11.5" font-weight="500">Per-product &#8594; merchant</text>
  <text x="20" y="557" fill="#e09226" font-size="11.5" font-weight="500">listing markup.</text>
</svg>
